name: Tag

on:
    pull_request: ~
    workflow_dispatch:
        inputs:
            version:
                description: Release version without the leading v, e.g. 1.1.6
                type: string
                required: true
            dry-run:
                description: Run everything, including the bump commit and the tag, but do not push them. Lets the workflow be exercised from any branch.
                type: boolean
                default: true
            allow-empty-release:
                description: Release a commit that already carries a version tag
                type: boolean
                default: false
            skip-sequence-check:
                description: Release a version that does not follow the latest tag
                type: boolean
                default: false

jobs:
    checks:
        name: CI
        runs-on: 'ubuntu-26.04'
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
            - run: yarn install
            - run: yarn test

    tag:
        name: Tag
        needs: checks
        uses: ibexa/gh-workflows/.github/workflows/tag.yml@tag-workflow
        with:
            version: ${{ inputs.version || '1.1.6' }}
            dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
            allow-empty-release: ${{ inputs.allow-empty-release || false }}
            skip-sequence-check: ${{ inputs.skip-sequence-check || false }}
            release-branches: major.x
            bump-command: >-
                sed --in-place --regexp-extended "s/^(\s*\"version\":\s*)\"[^\"]*\"/\1\"${VERSION}\"/" package.json
            version-file: package.json
        secrets:
            AUTOMATION_CLIENT_ID: ${{ secrets.AUTOMATION_CLIENT_ID }}
            AUTOMATION_CLIENT_SECRET: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
